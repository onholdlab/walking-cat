// ===== ground =====
const MAX=40,rp=[],rc=[];for(let i=0;i<MAX;i++){rp.push(new THREE.Vector4(0,0,-99,0));rc.push(new THREE.Vector3(1,1,1))}let ri=0;

vec3 pal(float k){if(k<.166)return vec3(1.,.84,.89);if(k<.333)return vec3(.85,.93,1.);if(k<.5)return vec3(.88,.97,.88);if(k<.666)return vec3(1.,.95,.82);if(k<.833)return vec3(.92,.87,1.);return vec3(.82,.96,.95);}

col=mix(col,rc[i],clamp((exp(-pow(d-r,2.)*6./sc)*exp(-a*1.4/sc)*.9+exp(-d*d*6./(sc*sc))*exp(-a*2./sc)*.6)*min(rp[i].w,1.),0.,1.));}
vec3 l=normalize(vec3(.4,1.,.5));float df=.78+.22*dot(vn,l);vec3 hv=normalize(l+vec3(0,1,.6));float sp=pow(max(dot(vn,hv),0.),70.)*smoothstep(.002,.02,abs(vh))*1.5;

const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80,300,300),G);ground.frustumCulled=false;S.add(ground);
const cellCol=(x,z)=>floorColorAt(x,z).map(v=>v*.9);

// ===== toon cat =====
const gm=new THREE.DataTexture(new Uint8Array([150,150,150,255,215,215,215,255,255,255,255,255]),3,1);gm.minFilter=gm.magFilter=THREE.NearestFilter;gm.needsUpdate=true;

if(line){const o=new THREE.Mesh(geo,lineM);o.scale.setScalar(1+line/ (geo.boundingSphere||(geo.computeBoundingSphere(),geo.boundingSphere)).radius);m.add(o)}parent.add(m);return m}

const bodyG=new THREE.Group();root.add(bodyG);

part(sph(.2),patch,torso,{p:[0,-.08,-.2],s:[1,1.2,.5],line:0});

for(const s of[-1,1]){
 const ear=new THREE.Group();ear.position.set(.27*s,.32,-.02);ear.rotation.z=-.35*s;head.add(ear);
 part(new THREE.ConeGeometry(.15,.28,24),s<0?patch:fur,ear,{p:[0,.1,0]});part(new THREE.ConeGeometry(.085,.18,20),pink,ear,{p:[0,.07,.05],line:0});
 const eye=part(sph(.075),ink,head,{p:[.19*s,.02,.4],s:[.9,1.15,.5],line:0});part(sph(.025),white,eye,{p:[.025,.035,.06],line:0});

 for(const k of[-1,1])part(new THREE.CylinderGeometry(.006,.006,.22,4),ink,head,{p:[.42*s,-.06+k*.03,.28],r:[0,0,Math.PI/2+.12*k*s],line:0});}
part(sph(.035),pink,head,{p:[0,-.06,.45],s:[1.3,.8,.6],line:0});
const mouth=part(new THREE.TorusGeometry(.04,.009,6,16,Math.PI),ink,head,{p:[0,-.12,.43],r:[0,0,Math.PI],line:0});
const legs=[];[[-.17,.25],[.17,.25],[-.17,-.28],[.17,-.28]].forEach(([x,z],i)=>{
 const g=new THREE.Group();bodyG.add(g);const l=part(new THREE.CapsuleGeometry(.085,.16,6,14),i==1?patch:fur,g,{p:[0,.15,0]});
 const paw=part(sph(.11),fur,g,{p:[0,.06,.02],s:[1,.7,1.15]});
 legs.push({g,x,z,paw,front:i<2,down:true})});
const tail=[];let tp=bodyG;for(let i=0;i<7;i++){const s=new THREE.Group();s.position.set(0,i?.11:.55,i?0:-.42);tp.add(s);
 part(sph(.075-i*.004),i>4?patch:fur,s,{line:.025});tail.push(s);tp=s}

const frontG=new THREE.Group(),rearG=new THREE.Group(),frontIn=new THREE.Group(),rearIn=new THREE.Group();
frontG.position.y=rearG.position.y=.5;frontIn.position.y=rearIn.position.y=-.5;frontG.add(frontIn);rearG.add(rearIn);bodyG.add(frontG,rearG);
rearIn.add(torso);torso.scale.y=.72;torso.position.z=-.13;

const bellyM=T(0xffeef2);part(sph(.2),bellyM,rearIn,{p:[0,.24,-.12],s:[1,.35,1.9],line:0});part(sph(.17),bellyM,frontIn,{p:[0,.26,.18],s:[1,.35,1.2],line:0});

// ===== audio =====
let AC=null,on=true,started=false;

const dayKey=()=>new Date().toLocaleDateString('sv');

try{const r=JSON.parse(localStorage.getItem('jellycat.steps.v1')||'null');if(r&&typeof r.day==='string'&&Number.isSafeInteger(r.total)&&r.total>=0&&Number.isSafeInteger(r.today)&&r.today>=0&&r.today<=r.total){st=r;if(st.day!==dayKey()){st.day=dayKey();st.today=0}}}catch(e){}
const nEl=document.getElementById('n'),tEl=document.getElementById('tot');
const fmt=v=>v.toLocaleString('en-US');

function saveSteps(){dirty=0;try{localStorage.setItem('jellycat.steps.v1',JSON.stringify(st))}catch(e){}}
// GoatCounter 事件（只記次數，不記個人步數）
function gcEvent(name){try{window.goatcounter&&goatcounter.count&&goatcounter.count({path:'walking-cat/'+name,title:name,event:true})}catch(e){}}

showSteps();addEventListener('pagehide',saveSteps);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveSteps();else resetDay()});
setInterval(resetDay,1000);
function squish(pan,big=0){if(!AC||!on)return;if(slimeBuf){slimeStep(pan,big);return}const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),p=AC.createStereoPanner();

function slimeStep(pan,big){const t=AC.currentTime,src=AC.createBufferSource(),g=AC.createGain(),p=AC.createStereoPanner();
 src.buffer=slimeBuf;const rate=(big?1.9:2.7)*(.92+Math.random()*.18);src.playbackRate.value=rate;
 const d=(big?.62:.34),v=big?.95:.7;
 g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(v,t+d*.6);g.gain.linearRampToValueAtTime(0,t+d);
 p.pan.value=pan;src.connect(g).connect(p).connect(AC.destination);src.start(t);src.stop(t+d+.02)}
